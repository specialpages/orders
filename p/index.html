<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08070b">
<title>SpecialPage ♡</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=DM+Sans:wght@400;500&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#08070b;
  --text:#fff8fb;
  --muted:#bcaeb6;
  --pink:#ff8fb1;
  --soft:#ffd8e4;
  --line:#ffffff18;
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:"DM Sans",sans-serif;
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  opacity:.14;
  background-image:radial-gradient(#fff 1px,transparent 1px);
  background-size:46px 46px;
  z-index:0;
}

#app{
  position:relative;
  z-index:1;
}

button{
  font:inherit;
}

.loading,
.error,
.pin-screen{
  min-height:100svh;
  display:grid;
  place-items:center;
  padding:30px;
  text-align:center;
}

.loader-card{
  max-width:620px;
}

.loader-heart{
  font-size:2rem;
  color:var(--pink);
  animation:pulse 1.6s ease-in-out infinite;
}

@keyframes pulse{
  50%{transform:scale(1.18)}
}

.kicker{
  font-size:.64rem;
  letter-spacing:.28em;
  text-transform:uppercase;
  color:var(--soft);
}

h1,h2,h3{
  font-family:"Playfair Display",serif;
  font-weight:500;
  line-height:1.1;
}

p{
  line-height:1.8;
  color:var(--muted);
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--line);
  background:#ffffff08;
  color:#fff;
  border-radius:999px;
  padding:13px 22px;
  cursor:pointer;
  text-decoration:none;
}

.btn:hover{
  border-color:#ff8fb155;
  background:#ff8fb10d;
}

section{
  min-height:100svh;
  padding:90px 20px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.wrap{
  width:min(900px,100%);
  margin:auto;
}

.center{
  text-align:center;
}

/* FOREVER */

.forever{
  background:#08070b;
}

.forever .hero{
  min-height:100svh;
  text-align:center;
  background:
    radial-gradient(
      circle at 50% 42%,
      #301621 0,
      #0b080d 42%,
      #08070b 100%
    );
}

.forever h1{
  font-size:clamp(3rem,13vw,7rem);
  font-style:italic;
  margin:22px 0;
}

.forever .hero-copy{
  max-width:620px;
  margin:0 auto 30px;
  font-family:"Playfair Display",serif;
  font-style:italic;
  font-size:clamp(1.2rem,4vw,1.8rem);
  color:#fff;
}

.forever .letter{
  background:linear-gradient(145deg,#ffffff0a,#ffffff03);
  border:1px solid var(--line);
  border-radius:30px;
  padding:clamp(25px,6vw,55px);
  box-shadow:0 30px 90px #0008;
}

.forever .letter p{
  font-family:"Playfair Display",serif;
  font-size:clamp(1.08rem,3.5vw,1.45rem);
  line-height:1.8;
  color:#f4eaf0;
}

.forever .letter em{
  color:var(--soft);
}

.forever .quote{
  font-family:"Playfair Display",serif;
  font-style:italic;
  font-size:clamp(1.6rem,5vw,3rem);
  line-height:1.45;
  color:#fff;
  max-width:720px;
  margin:auto;
}

.forever .things{
  display:grid;
  gap:14px;
  max-width:700px;
  margin:35px auto;
}

.forever .thing{
  padding:20px 22px;
  border-left:1px solid var(--pink);
  background:#ffffff05;
  border-radius:0 18px 18px 0;
  text-align:left;
  font-family:"Playfair Display",serif;
  font-size:1.2rem;
}

.forever .final{
  background:
    radial-gradient(circle at 50% 50%,#301621,#08070b 60%);
}

.forever .name{
  font-size:clamp(3.5rem,16vw,8rem);
  font-style:italic;
}

.forever .heart{
  font-size:2rem;
  color:var(--pink);
  animation:pulse 1.7s infinite;
}

/* MEMORIES */

.memories{
  background:#07070a;
}

.memories section{
  min-height:auto;
  padding:90px 20px;
}

.memories .hero{
  min-height:100svh;
  text-align:center;
  background:
    radial-gradient(circle at 50% 35%,#24131c,#07070a 62%);
}

.memories .hero h1{
  font-size:clamp(3rem,13vw,7rem);
  font-style:italic;
  margin:22px 0;
}

.memories .hero-copy{
  max-width:650px;
  margin:0 auto 30px;
  font-family:"Playfair Display",serif;
  font-style:italic;
  font-size:clamp(1.2rem,4vw,1.8rem);
  color:#eee;
}

.memories .gallery{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
  margin-top:40px;
}

.memories .photo{
  position:relative;
  background:#0d0b10;
  border:6px solid #f2e9ed;
  box-shadow:0 22px 55px #0009;
  overflow:hidden;
  min-height:220px;
}

.memories .photo img{
  width:100%;
  height:100%;
  min-height:220px;
  display:block;
  object-fit:cover;
  cursor:pointer;
}

.memories .photo:nth-child(odd){
  transform:rotate(-1.2deg);
}

.memories .photo:nth-child(even){
  transform:rotate(1.2deg);
}

.memories .story{
  max-width:700px;
  margin:45px auto;
  text-align:center;
}

.memories .story p{
  font-family:"Playfair Display",serif;
  font-size:clamp(1.15rem,3.5vw,1.5rem);
  color:#eee;
}

.memories .audio-card{
  max-width:600px;
  margin:35px auto;
  padding:28px;
  border:1px solid var(--line);
  border-radius:25px;
  background:#ffffff05;
  text-align:center;
}

.memories audio{
  width:100%;
  margin-top:18px;
}

.memories .final{
  min-height:90svh;
  text-align:center;
  background:
    radial-gradient(circle at 50% 45%,#2a1720,#07060a 68%);

/* LETTER */

.letter-template:before{

.letter-template .kicker{

.letter-template h1,

.letter-template p{

}

.letter-template .hero h1{

.letter-template .hero-copy{

  font-style:italic;
  font-size:clamp(1.2rem,4vw,1.8rem);

}

.letter-template .paper{
  max-width:760px;

}

.letter-template .paper p{

.letter-template .paper em{

.letter-template .final-paper{

  padding:40px 28px;

.letter-template .final-text{

.letter-template .sign{

/* COMMON */

.reveal{

  transform:translateY(22px);

.reveal.show{

.empty{

.lightbox{

.lightbox img{

<script>

const SUPABASE_URL =
  "https://omwcwpcymievkcwuurmi.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_oGZ6x_40l70-4TV53FIq1A_mq2uvPCb";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const app =
  document.getElementById("app");

const params =
  new URLSearchParams(location.search);

const pageId =
  params.get("id");


function esc(s){

  return String(s ?? "")
    .replace(/[&<>"']/g,c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[c]));

}


function parseJson(value){

  if(!value) return {};

  if(typeof value === "object")
    return value;

  try{
    return JSON.parse(value);
  }catch{
    return {};
  }

}


function showError(message){

  app.innerHTML = `
    <div class="error">
      <div class="loader-card">

        <div class="kicker">
          specialpage
        </div>

        <h2>
          We couldn’t open this page.
        </h2>

        <p>
          ${esc(message)}
        </p>

      </div>
    </div>
  `;

}


async function findOrder(id){

  if(!id)
    throw new Error(
      "This SpecialPage link is missing its ID."
    );

  let result =
    await db
      .from("orders")
      .select(`
        id,
        customer_name,
        recipient_name,
        occasion,
        occasion_date,
        message,
        special_request,
        admin_notes,
        order_status,
        payment_status,
        status,
        razorpay_order_id
      `)
      .eq("razorpay_order_id",id)
      .maybeSingle();

  if(result.error)
    throw result.error;

  let data =
    result.data;

  /*
   Fallback:
   also allow internal order UUID.
  */

  if(!data){

    result =
      await db
        .from("orders")
        .select(`
          id,
          customer_name,
          recipient_name,
          occasion,
          occasion_date,
          message,
          special_request,
          admin_notes,
          order_status,
          payment_status,
          status,
          razorpay_order_id
        `)
        .eq("id",id)
        .maybeSingle();

    if(result.error)
      throw result.error;

    data =
      result.data;

  }

  if(!data)
    throw new Error(
      "SpecialPage not found."
    );

  /*
   Only published / paid orders
   can open the customer page.
  */

  if(
    data.payment_status !== "paid" &&
    data.order_status !== "paid" &&
    data.status !== "paid"
  ){

    throw new Error(
      "This SpecialPage is not published yet."
    );

  }

  return data;

}


async function mediaUrls(orderId,kind){

  const found = [];

  async function walk(prefix){

    const {
      data,
      error
    } =
      await db.storage
        .from("customer-media")
        .list(
          prefix,
          {limit:100}
        );

    if(error)
      return;

    for(const item of data || []){

      const path =
        prefix + "/" + item.name;

      if(
        item.id === null ||
        item.metadata === null
      ){

        await walk(path);

      }else{

        found.push(path);

      }

    }

  }

  await walk(
    orderId + "/" + kind
  );

  const urls = [];

  for(const path of found){

    const {data} =
      await db.storage
        .from("customer-media")
        .createSignedUrl(
          path,
          3600
        );

    if(data?.signedUrl){

      urls.push({
        path:path,
        url:data.signedUrl
      });

    }

  }

  return urls;

}


function getContent(order){

  const request =
    parseJson(
      order.special_request
    );

  const notes =
    parseJson(
      order.admin_notes
    );

  return {

    template:String(
      request.template ||
      notes.template ||
      "forever"
    ).toLowerCase(),

    pin:String(
      request.pin ||
      notes.pin ||
      ""
    ),

    memories:String(
      request.memories ||
      ""
    ),

    reasons:String(
      request.reasons ||
      ""
    ),

    mood:String(
      request.mood ||
      ""
    )

  };

}


function paragraphs(text){

  return String(text || "")
    .split(/\n+/)
    .map(x=>x.trim())
    .filter(Boolean);

}

/* =========================
   MEMORIES TEMPLATE
========================= */

function renderMemories(
  order,
  c,
  photos,
  audios,
  videos
){

  const recipient =
    order.recipient_name ||
    "someone special";

  const msg =

  const photoItems =
    photos.length

      ? photos.map(
          (m,i)=>`

          <div class="photo">

            <img
              src="${esc(m.url)}"
              alt="Memory ${i+1}"
              data-lightbox="${esc(m.url)}"
            >

      : `

        <div
          class="empty"
          style="grid-column:1/-1"
        >
          No photos were added to this

        </div>

      `;


  const story =
    paragraphs(c.memories);


  const audioHtml =
    audios.length

      ? audios.map(
          m=>`

          <audio
            controls
            preload="metadata"
            src="${esc(m.url)}">
          </audio>

          `
        ).join("")

      : `

        <p>
          No personal audio was added.
          The memories can still speak
          for themselves. ♡
        </p>

      `;


  const videoHtml =

          little moments

/* =========================
   PIN
========================= */

function showPin(
  order,
  c,
  continueFn
){

  app.innerHTML = `

    <div class="pin-screen">

      <div class="pin-box">

        <div class="kicker">
          private specialpage
        </div>

        <h2>
          This page is locked. ♡
        </h2>

        <p>
          Enter the 4-digit PIN to open it.
        </p>

        <input
          id="pagePin"
          inputmode="numeric"
          maxlength="4"
          autocomplete="off"
          aria-label="PIN"
        >

        <button
          class="btn"
          id="unlockBtn"
          type="button"
        >
          Open page
        </button>

        <div
          class="status"
          id="pinStatus">
        </div>

      </div>

    </div>

  `;


  const input =
    document.getElementById(
      "pagePin"
    );

  const button =
    document.getElementById(
      "unlockBtn"
    );

  const status =
    document.getElementById(
      "pinStatus"
    );


  const unlock = ()=>{

    if(
      input.value === c.pin
    ){

      continueFn();
      return;

    }

    status.textContent =
      "That PIN isn't correct.";

    input.value = "";

    input.focus();

  };


  button.onclick =
    unlock;


  input.addEventListener(
    "keydown",
    e=>{

      if(e.key === "Enter")
        unlock();

    }
  );


  input.focus();

}


/* =========================
   ANIMATIONS
========================= */

function initReveal(){

  const targets =
    document.querySelectorAll(
      ".reveal"
    );

  const io =
    new IntersectionObserver(
      entries=>{

        entries.forEach(
          e=>{

            if(e.isIntersecting)
              e.target.classList.add(
                "show"
              );

          }
        );

      },
      {
        threshold:.12
      }
    );


  targets.forEach(
    x=>io.observe(x)
  );


  setTimeout(
    ()=>{
      targets.forEach(
        x=>x.classList.add("show")
      );
    },
    900
  );

}


/* =========================
   PHOTO LIGHTBOX
========================= */

function initLightbox(){

  const box =
    document.getElementById(
      "lightbox"
    );

  const image =
    document.getElementById(
      "lightboxImg"
    );


  document
    .querySelectorAll(
      "[data-lightbox]"
    )
    .forEach(
      img=>{

        img.addEventListener(
          "click",
          ()=>{

            image.src =
              img.dataset.lightbox;

            box.classList.add(
              "open"
            );

          }
        );

      }
    );


  const close =
    ()=>box.classList.remove(
      "open"
    );


  document
    .getElementById(
      "lightboxClose"
    )
    .onclick =
    close;


  box.onclick =
    e=>{

      if(e.target === box)
        close();

    };

}


/* =========================
   LOAD PAGE
========================= */

(async()=>{

  try{

    const order =
      await findOrder(
        pageId
      );


    const content =
      getContent(
        order
      );


    const [
      photos,
      audios,
      videos
    ] =
      await Promise.all([

        mediaUrls(
          order.id,
          "photos"
        ),

        mediaUrls(
          order.id,
          "audio"
        ),

        mediaUrls(
          order.id,
          "videos"
        )

      ]);


    const render =
      ()=>{

        let template =
          content.template;


        if(
          ![
            "forever",
            "memories",
            "letter"
          ].includes(template)
        ){

          template =
            "forever";

        }


        if(
          template === "memories"
        ){

          app.innerHTML =
            renderMemories(
              order,
              content,
              photos,
              audios,
              videos
            );

        }

        else if(
          template === "letter"
        ){

          app.innerHTML =
            renderLetter(
              order,
              content
            );

        }

        else{

          app.innerHTML =
            renderForever(
              order,
              content
            );

        }


        document.title =
          `For ${
            order.recipient_name ||
            "Someone Special"
          } ♡`;


        initReveal();

        initLightbox();

      };


    if(content.pin){

      showPin(
        order,
        content,
        render
      );

    }

    else{

      render();

    }


  }

  catch(err){

    console.error(err);

    showError(
      err?.message ||
      "Please try again later."
    );

  }

})();

</script>
