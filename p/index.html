<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpecialPage ♡</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08070b;color:#f8f1f4;font-family:Arial,sans-serif;min-height:100vh}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:35px 18px}
.card{width:min(600px,100%);text-align:center;padding:50px 28px;border:1px solid #ffffff14;border-radius:30px;background:radial-gradient(circle at 50% 20%,#542a3d55,transparent 55%),#0d0b10;box-shadow:0 30px 100px #000}
.kicker{font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:#bda5af}
h1{font-family:Georgia,serif;font-style:italic;font-weight:400;font-size:clamp(42px,10vw,70px);margin:22px 0}
.message{color:#aaa0a7;font-size:13px;line-height:1.9;white-space:pre-wrap}
.loading{color:#81757d;font-size:12px}
.error{color:#d9a8b9;line-height:1.7}
button{border:1px solid #ffffff1c;background:#e5c2cf;color:#171016;border-radius:999px;padding:13px 22px;cursor:pointer;font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-top:25px}
#content{display:none}
</style>
</head>
<body>
<div class="page"><div class="card">
<div id="loading" class="loading">Opening your SpecialPage…</div>
<div id="error" class="error"></div>
<div id="content">
<div class="kicker" id="occasion">your special moment</div>
<h1 id="title">For someone special ♡</h1>
<div class="message" id="message"></div>
<button id="startButton">Enter ♡</button>
</div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://omwcwpcymievkcwuurmi.supabase.co";
const SUPABASE_KEY="sb_publishable_oGZ6x_40l70-4TV53FIq1A_mq2uvPCb";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function getOrderId(){
  const parts=window.location.pathname.split("/").filter(Boolean);
  const pIndex=parts.indexOf("p");
  return pIndex!==-1&&parts[pIndex+1]?parts[pIndex+1]:null;
}

async function loadPage(){
  try{
    const shortId=getOrderId();
    if(!shortId) throw new Error("Invalid SpecialPage link.");

    const {data,error}=await supabaseClient
      .from("orders")
      .select("id,recipient_name,occasion,message,payment_status")
      .ilike("id",shortId+"%")
      .maybeSingle();

    if(error) throw error;
    if(!data) throw new Error("SpecialPage not found.");
    if(data.payment_status!=="paid")
      throw new Error("This SpecialPage is not available yet.");

    document.getElementById("loading").style.display="none";
    document.getElementById("content").style.display="block";
    document.getElementById("occasion").textContent=data.occasion||"your special moment";
    document.getElementById("title").textContent="For "+(data.recipient_name||"someone special")+" ♡";
    document.getElementById("message").textContent=data.message||"Something special was made just for you.";

    document.getElementById("startButton").onclick=()=>{
      alert("Your full SpecialPage experience will open here. ♡");
    };
  }catch(error){
    console.error(error);
    document.getElementById("loading").style.display="none";
    document.getElementById("error").textContent=error.message||"Something went wrong.";
  }
}
loadPage();
</script> 
</body>
</html>
